<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Texto infinito para Roberto 😴</title>
<style>
  body {
    font-family: Georgia, serif;
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    line-height: 1.6;
    background: #f4f4f4;
    color: #222;
  }
  p {
    margin-bottom: 15px;
    text-align: justify;
  }
</style>
</head>
<body>
<h1>La función del significante en el sueño (versión infinita)</h1>
<div id="contenedor"></div>

<script>
  const texto = "Roberto la función del significante en el sueño no es representar lo reprimido sino insistir en su propia cadena metonímica donde el deseo se desplaza sin cesar de un objeto a otro y el sujeto se encuentra dividido entre el yo y el ello en una estructura que no cesa de no escribirse y por eso el sueño es la vía regia al inconsciente pero también un texto ilegible que solo se descifra retroactivamente cuando el analizante habla y habla y habla sin llegar nunca al final porque la interpretación no cierra el sentido sino que lo abre a nuevas sustituciones y así el goce se cuela por las fisuras del lenguaje en una repetición que no tiene fin ";

  const contenedor = document.getElementById("contenedor");

  // ⚠️ while infinito: agrega párrafos sin parar
  while (true) {
    const p = document.createElement("p");
    p.textContent = texto;
    contenedor.appendChild(p);
  }
</script>
</body>
</html>
